<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>应用选择 · 网格效果图</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#d8d8d4;min-height:100%;font-family:"Hiragino Sans GB","PingFang SC",sans-serif}
  body{display:grid;place-items:center;min-height:100vh;padding:28px}
  .frame{width:480px;height:640px;position:relative}
  .device{position:absolute;left:0;top:0;width:240px;height:320px;transform:scale(2);transform-origin:top left;overflow:hidden;background:#101b24;color:#f0e8d8}
  .status{height:24px;display:flex;align-items:center;gap:7px;padding:0 10px;background:#0c171f;border-bottom:1px solid #31404a;color:#e7ddc8;font-size:12px}
  .signal{display:flex;align-items:flex-end;gap:2px;width:18px;height:13px}.signal i{display:block;width:3px;background:#d9cfb9}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:7px}.signal i:nth-child(3){height:10px}.signal i:nth-child(4){height:13px}
  .title{font-size:15px;font-weight:600;margin-left:5px}.battery{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px}.battery b{display:block;width:25px;height:11px;border:1px solid #e2d8c1;border-radius:2px;position:relative}.battery b:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#e2d8c1}.battery b:before{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:18px;background:#83c4b6}
  .section{height:18px;margin-top:3px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;color:#9cacab;font-size:10px;letter-spacing:.08em}
  .grid{position:absolute;left:8px;top:43px;width:224px;height:234px;display:grid;grid-template-columns:repeat(3,70px);grid-template-rows:repeat(4,54px);column-gap:7px;row-gap:6px}
  .app{position:relative;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;color:#c8c2b5;border:1px solid transparent;border-radius:6px}
  .app svg{width:25px;height:25px;display:block;color:#c6c1b6;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .app span{font-size:12px;line-height:18px;height:18px;white-space:nowrap;margin-top:1px;color:#aaa79e}
  .app.selected{background:#1b2b35;border:2px solid #e2b85d;padding-top:3px;color:#f4dc9e;box-shadow:inset 0 0 0 1px rgba(255,240,200,.08)}
  .app.selected span{color:#f3ead2;font-weight:600}
  .app.selected:before{content:"";position:absolute;left:4px;top:4px;width:4px;height:4px;background:#e8bc60}
  .settings{grid-column:2;grid-row:4}
  .footer{position:absolute;left:0;bottom:0;width:240px;height:30px;border-top:1px solid #33434d;background:#0b161e;color:#9da8aa;text-align:center;font-size:10.5px;line-height:14px;padding-top:1px}
  .footer b{color:#d8c9aa;font-weight:500}
</style>
<div class="frame">
  <div class="device">
    <div class="status">
      <div class="signal"><i></i><i></i><i></i><i></i></div>
      <div class="title">应用</div>
      <div class="battery">98%<b></b></div>
    </div>
    <div class="section"><span>选择一个应用</span><span>08 / 10</span></div>
    <div class="grid">
      <div class="app"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="3"/><path d="M9 7V5m6 2V5M9 14h.01M15 14h.01M9 18v2m6-2v2"/></svg><span>小智 AI</span></div>
      <div class="app"><svg viewBox="0 0 24 24"><path d="M4 9h11v8H4zM15 11h3l2 2v4h-5zM7 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm10 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM7 6v3m3-3v3m3-3v3"/></svg><span>城市收音机</span></div>
      <div class="app"><svg viewBox="0 0 24 24"><path d="M10 17V6l8-2v11"/><circle cx="7" cy="18" r="3"/><circle cx="18" cy="15" r="3"/></svg><span>音乐播放器</span></div>
      <div class="app"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M9 4h6M12 4v3m0 3v3l2 2"/></svg><span>番茄时钟</span></div>
      <div class="app"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M10 3h4M12 3v3m0 4v4l3 2"/></svg><span>秒表</span></div>
      <div class="app"><svg viewBox="0 0 24 24"><path d="M5 17h14l-2-2v-5a5 5 0 0 0-10 0v5zM10 20h4"/></svg><span>备忘提醒</span></div>
      <div class="app"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/><path d="m17 16 2 2 3-4"/></svg><span>文字清单</span></div>
      <div class="app selected"><svg viewBox="0 0 24 24"><path d="M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v5H4zM13 14h7v5h-7z"/></svg><span>八字排盘</span></div>
      <div class="app"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 3v5m8-5v5M4 11h16M8 15h2m4 0h2M8 18h2"/></svg><span>万年历</span></div>
      <div class="app settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2" fill="#101b24"/><circle cx="15" cy="12" r="2" fill="#101b24"/><circle cx="10" cy="17" r="2" fill="#101b24"/></svg><span>设置</span></div>
    </div>
    <div class="footer"><b>上下逐项 · 长按跨行</b><br>确定打开 · 长按确定返回</div>
  </div>
</div>
</html>
